name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { php: '8.2', laravel: '11.*', testbench: '9.*' }
          - { php: '8.2', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*' }

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        env:
          # Laravel 11 (EOL) tiene avisos de seguridad que bloquean la resolución; solo para probar compatibilidad.
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest
